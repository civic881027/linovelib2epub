<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>輕小說轉 EPUB</title>
<style>
  :root {
    --line: #d8d8de;
    --ink: #1b1b1f;
    --muted: #6b6b76;
    --accent: #2f5bd7;
    --panel: #ffffff;
    --page: #f5f5f7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --line: #3a3a42;
      --ink: #e9e9ee;
      --muted: #9a9aa6;
      --accent: #7aa0ff;
      --panel: #212128;
      --page: #16161a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 16px; background: var(--page); color: var(--ink);
    font-family: "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", "Heiti TC", sans-serif;
    font-size: 15px; line-height: 1.6;
  }
  main { max-width: 860px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 16px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 20px; margin-bottom: 16px; }
  .grid { display: grid; grid-template-columns: 130px 1fr; gap: 12px 14px; align-items: center; }
  label { color: var(--muted); }
  input[type=text], input[type=number], select {
    width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px;
    background: var(--page); color: var(--ink); font: inherit;
  }
  .row { display: flex; gap: 8px; }
  .hint { color: var(--muted); font-size: 13px; }
  .checks { display: flex; flex-wrap: wrap; gap: 18px; margin-top: 16px; }
  .checks label { color: var(--ink); display: flex; align-items: center; gap: 6px; }
  button {
    font: inherit; padding: 9px 18px; border-radius: 6px; border: 1px solid var(--accent);
    background: var(--accent); color: #fff; cursor: pointer;
  }
  button.secondary { background: transparent; color: var(--accent); }
  button:disabled { opacity: .55; cursor: default; }
  .actions { display: flex; gap: 10px; margin-top: 18px; }
  #start { flex: 1; padding: 11px; }
  #log {
    height: 320px; overflow-y: auto; white-space: pre-wrap; word-break: break-all;
    background: var(--page); border: 1px solid var(--line); border-radius: 6px; padding: 12px;
    font-size: 13px; font-family: ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace;
  }
  #volumes { display: none; }
  #progress { display: none; margin-bottom: 12px; }
  .progress-line { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 6px; }
  .bar { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
  .bar > div { height: 100%; width: 0; background: var(--accent); transition: width .4s ease; }
  #volumeList { max-height: 300px; overflow-y: auto; border: 1px solid var(--line); border-radius: 6px; padding: 10px; }
  #volumeList label { display: flex; gap: 8px; align-items: flex-start; padding: 3px 0; color: var(--ink); }
  .notice { padding: 10px 12px; border-radius: 6px; border: 1px solid var(--line); margin-bottom: 12px; }
  .notice.bad { border-color: #d05050; }
  .notice.good { border-color: #3f9d55; }
</style>
</head>
<body>
<main>
  <h1>輕小說轉 EPUB</h1>

  <div class="panel" id="form">
    <div class="grid">
      <label for="bookId">書籍編號</label>
      <div>
        <input type="text" id="bookId" inputmode="numeric" placeholder="例如 2978">
        <div class="hint">網址 novel/2978.html 中間的數字</div>
      </div>

      <label for="site">小說網站</label>
      <select id="site"></select>

      <label for="chapterDelay">章節間隔</label>
      <div class="row">
        <input type="number" id="chapterDelay" min="0" max="120" style="width:110px">
        <span class="hint" style="align-self:center">秒</span>
      </div>

      <label for="pageDelay">分頁間隔</label>
      <div class="row">
        <input type="number" id="pageDelay" min="0" max="120" style="width:110px">
        <span class="hint" style="align-self:center">秒，間隔太短容易被網站限流</span>
      </div>

      <label for="outputDir">輸出資料夾</label>
      <input type="text" id="outputDir">

      <label for="browserPath">瀏覽器路徑</label>
      <div>
        <input type="text" id="browserPath" placeholder="留空自動尋找已安裝的瀏覽器">
      </div>

      <label for="logLevel">記錄詳細程度</label>
      <select id="logLevel" style="width:200px"></select>
    </div>

    <div class="checks">
      <label><input type="checkbox" id="divideVolume" checked>每卷各存一個檔案</label>
      <label><input type="checkbox" id="selectVolumeMode">自選卷數</label>
      <label><input type="checkbox" id="hasIllustration" checked>下載插圖</label>
      <label><input type="checkbox" id="headless" checked>隱藏瀏覽器視窗</label>
      <label><input type="checkbox" id="resume" checked>沿用上次未完成的進度</label>
    </div>

    <div class="actions">
      <button id="start">開始下載</button>
      <button id="stop" class="secondary" disabled>停止下載</button>
      <button id="quit" class="secondary">結束程式</button>
    </div>
    <div class="hint" style="margin-top:10px">下載中可以切到其他分頁；Chrome 若把這個分頁捨棄，下載仍會繼續，點回來即可看到進度。要避免被捨棄，可把分頁釘選，或在 Chrome「效能」設定將 127.0.0.1 加入永遠保持啟用。</div>
  </div>

  <div class="panel" id="volumes">
    <h1 style="font-size:16px">選擇要下載的卷</h1>
    <div id="volumeList"></div>
    <div class="row" style="margin-top:12px">
      <button id="volumeOk">確定</button>
      <button id="volumeCancel" class="secondary">取消</button>
    </div>
  </div>

  <div class="panel">
    <h1 style="font-size:16px">執行紀錄</h1>
    <div id="message"></div>
    <div id="progress">
      <div class="progress-line">
        <span id="progressText"></span>
        <span id="etaText" class="hint"></span>
      </div>
      <div class="bar"><div id="barFill"></div></div>
    </div>
    <div id="log"></div>
  </div>
</main>

<script>
const CONFIG = __CONFIG__;
const TOKEN = new URLSearchParams(location.search).get('token') || '';
const $ = (id) => document.getElementById(id);
let cursor = 0;
let volumesShown = false;
let volumeRequest = 0;    // the question on screen
let answeredRequest = 0;  // the question last answered; a stale poll must not bring it back
let running = false;
let stopRequested = false;
let stopped = false;
let everConnected = false;

function fill(select, values, chosen) {
  select.innerHTML = '';
  for (const value of values) {
    const option = document.createElement('option');
    option.value = value;
    option.textContent = value;
    if (value === chosen) option.selected = true;
    select.appendChild(option);
  }
}

fill($('site'), CONFIG.sites, CONFIG.defaultSite);
fill($('logLevel'), CONFIG.logLevels, CONFIG.defaultLogLevel);
$('chapterDelay').value = CONFIG.defaultDelay;
$('pageDelay').value = CONFIG.defaultDelay;
$('outputDir').value = CONFIG.outputDir;

function api(path, options) {
  options = options || {};
  options.headers = Object.assign({'X-Token': TOKEN, 'Content-Type': 'application/json'}, options.headers || {});
  return fetch(path, options);
}

function readForm() {
  return {
    book_id: $('bookId').value.trim(),
    site_label: $('site').value,
    chapter_delay: parseInt($('chapterDelay').value, 10),
    page_delay: parseInt($('pageDelay').value, 10),
    output_dir: $('outputDir').value.trim(),
    browser_path: $('browserPath').value.trim(),
    log_level_label: $('logLevel').value,
    divide_volume: $('divideVolume').checked,
    select_volume_mode: $('selectVolumeMode').checked,
    has_illustration: $('hasIllustration').checked,
    headless: $('headless').checked,
    resume: $('resume').checked
  };
}

function showMessage(text, kind) {
  const box = $('message');
  if (!text) { box.innerHTML = ''; return; }
  box.innerHTML = '';
  const div = document.createElement('div');
  div.className = 'notice ' + (kind || '');
  div.textContent = text;
  box.appendChild(div);
}

$('start').addEventListener('click', async () => {
  showMessage('');
  $('start').disabled = true;
  stopRequested = false;
  try {
    const response = await api('/api/start', {method: 'POST', body: JSON.stringify(readForm())});
    const data = await response.json();
    if (!data.ok) {
      showMessage(data.error, 'bad');
      $('start').disabled = false;
    }
  } catch (error) {
    showMessage('無法連線到本機程式：' + error, 'bad');
    $('start').disabled = false;
  }
});

$('volumeOk').addEventListener('click', () => sendVolumes(
  [...document.querySelectorAll('#volumeList input:checked')].map((box) => Number(box.value))));
$('volumeCancel').addEventListener('click', () => sendVolumes([]));

async function sendVolumes(selected) {
  $('volumes').style.display = 'none';
  volumesShown = false;
  answeredRequest = volumeRequest;
  await api('/api/volumes', {method: 'POST', body: JSON.stringify({selected, request: volumeRequest})});
}

function showVolumes(titles, request) {
  volumeRequest = request;
  const list = $('volumeList');
  list.innerHTML = '';
  titles.forEach((title, index) => {
    const label = document.createElement('label');
    const box = document.createElement('input');
    box.type = 'checkbox';
    box.value = String(index);
    label.appendChild(box);
    label.appendChild(document.createTextNode(title));
    list.appendChild(label);
  });
  $('volumes').style.display = 'block';
  volumesShown = true;
  $('volumes').scrollIntoView({behavior: 'smooth'});
}

// Stops only the download; the program keeps serving this page so another one can be started.
$('stop').addEventListener('click', async () => {
  stopRequested = true;
  $('stop').disabled = true;
  try {
    await api('/api/stop', {method: 'POST'});
    showMessage('正在停止，目前這一步結束後就會停下。');
  } catch (error) {
    showMessage('無法連線到本機程式：' + error, 'bad');
  }
});

$('quit').addEventListener('click', async () => {
  if (running && !confirm('下載還在進行中，確定要結束程式嗎？')) return;
  stopped = true;
  running = false;
  try { await api('/api/quit', {method: 'POST'}); } catch (error) { /* it exits before replying */ }
  showMessage('程式已結束，可以關閉這個分頁。');
  $('start').disabled = true;
  $('stop').disabled = true;
  $('quit').disabled = true;
});

// Closing this page ends the program, so warn before an accidental close while downloading.
window.addEventListener('beforeunload', (event) => {
  if (running && !stopped) { event.preventDefault(); event.returnValue = ''; }
});
// Tell the program the page is going away. A reload also fires this; the program waits a moment
// for the reloaded page before quitting. A tab Chrome discards in the background does not fire it,
// so a discarded tab never ends a running download. sendBeacon cannot set headers: token in the URL.
window.addEventListener('pagehide', () => {
  if (!stopped) navigator.sendBeacon('/api/bye?token=' + encodeURIComponent(TOKEN));
});

function formatDuration(seconds) {
  const whole = Math.round(seconds);
  if (whole < 60) return '約 ' + whole + ' 秒';
  const minutes = Math.round(whole / 60);
  if (minutes < 60) return '約 ' + minutes + ' 分鐘';
  return '約 ' + Math.floor(minutes / 60) + ' 小時 ' + (minutes % 60) + ' 分';
}

function showProgress(progress) {
  if (!progress || !progress.total) { $('progress').style.display = 'none'; return; }
  $('progress').style.display = 'block';
  $('progressText').textContent = '已抓取 ' + progress.done + ' / ' + progress.total + ' 章';
  $('etaText').textContent = progress.etaSeconds
    ? '預估剩餘 ' + formatDuration(progress.etaSeconds) + '（僅計章節抓取，不含圖片與轉檔）'
    : '預估剩餘：計算中';
  $('barFill').style.width = (progress.done / progress.total * 100) + '%';
}

async function poll() {
  if (stopped) return;
  try {
    const response = await api('/api/state?cursor=' + cursor);
    const state = await response.json();
    everConnected = true;
    cursor = state.cursor;
    if (state.lines.length) {
      const log = $('log');
      const atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 40;
      log.textContent += state.lines.join('\n') + '\n';
      if (atBottom) log.scrollTop = log.scrollHeight;
    }
    showProgress(state.progress);
    if (state.volumes && !volumesShown && state.volumeRequest !== answeredRequest) {
      showVolumes(state.volumes, state.volumeRequest);
    }
    if (!state.volumes && volumesShown) { $('volumes').style.display = 'none'; volumesShown = false; }
    running = state.running;
    $('start').disabled = state.running;
    $('stop').disabled = !state.running || stopRequested;
    if (!state.running && state.result !== null) {
      if (state.stopped) showMessage('已停止下載。');
      else if (state.result === '') showMessage('完成，EPUB 已輸出到 ' + state.outputDir, 'good');
      else showMessage('失敗：' + state.result, 'bad');
    }
  } catch (error) {
    if (everConnected) showMessage('與程式的連線中斷，它可能已經結束了。', 'bad');
  }
}

setInterval(poll, 1000);
poll();
</script>
</body>
</html>
