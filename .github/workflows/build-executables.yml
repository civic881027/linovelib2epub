name: Build executables

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linovelib2epub-linux-x86_64
          - os: windows-latest
            artifact: linovelib2epub-windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - name: Install project
        run: uv sync --python 3.10
      - name: Build single-file executable
        run: uv run --with pyinstaller pyinstaller --noconfirm linovelib2epub.spec
      - name: Smoke test
        shell: bash
        run: ./dist/linovelib2epub --help
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/linovelib2epub*
          if-no-files-found: error
